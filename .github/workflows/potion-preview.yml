name: Publish potion test
on:
  push:
    paths:
      - '.github/workflows/potion-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: potion-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94f75066fa89b518d405cbf0fd9268e3471b678f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/build_release.py
      - name: Prepare standalone preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('release/index.html')
          s = p.read_text().replace('<script src="/sdk.js"></script>', '')
          p.write_text(s)
          Path('release/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
      - id: deploy
        uses: actions/deploy-pages@v4
