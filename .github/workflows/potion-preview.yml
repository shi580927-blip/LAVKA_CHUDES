name: Publish potion test
on:
  push:
    paths:
      - '.github/workflows/potion-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: potion-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94f75066fa89b518d405cbf0fd9268e3471b678f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/build_release.py
      - name: Prepare standalone preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('release/index.html')
          s = p.read_text().replace('<script src="/sdk.js"></script>', '')
          s = s.replace('<body>', '<body><div style="position:fixed;bottom:4px;left:8px;z-index:1000;color:white;background:#172638;padding:3px 8px;font:12px Arial;pointer-events:none">ТЕСТ: все 30 уровней открыты</div>')
          p.write_text(s)
          c = Path('release/src/campaign.js')
          code = c.read_text()
          code = code.replace("berries_campaign_v1", "potion_preview_campaign_v1").replace("berries_vs_04", "potion_preview_legacy")
          code = code.replace("function unlocked(s=read()){", "function unlocked(s=read()){return 30;")
          code = code.replace("s.lives=Math.min(5,number(s.lives,5));", "s.lives=5;s.nextLifeAt=null;")
          c.write_text(code)
          Path('release/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
      - id: deploy
        uses: actions/deploy-pages@v4
